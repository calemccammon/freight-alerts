name: Poll

# The scheduler lives here rather than inside the process. That is the whole
# reason this service needs no always-on host: nothing runs between cycles.
on:
  schedule:
    # Every 15 minutes. GitHub's cron is best-effort and can be late under load,
    # which is fine -- a delayed train is still delayed on the next cycle, and
    # the UNIQUE constraint means a late or duplicated run cannot double-notify.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Overlapping runs would still be safe (the database enforces suppression),
  # but there is no reason to pay for them.
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    name: Poll Digitraffic and alert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Without this guard the schedule starts firing the moment the repo exists
      # and fails every 15 minutes until a database is configured -- 96 failure
      # notifications a day for a service nobody has finished setting up yet.
      # Skipping cleanly means the workflow is ready and silent until it is real.
      - name: Check the database is configured
        id: config
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL secret is not set; skipping the poll. Add it in Settings → Secrets to activate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run one poll cycle
        if: steps.config.outputs.configured == 'true'
        run: go run ./cmd/freightalerts poll
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
